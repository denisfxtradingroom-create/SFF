name: SFF production database safety check
on:
  push:
    branches: [sff-turso-durable-storage-guard]
  workflow_dispatch:
jobs:
  check-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health and database mode
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 --retry-delay 5 --max-time 110 \
            https://sff-signal-api.onrender.com/health -o /tmp/sff-health.json
          cat /tmp/sff-health.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/sff-health.json","utf8"));if(!x.ok)process.exit(2);if(x.database!=="turso"){console.error("DEPLOY BLOCKED: production is local SQLite; Render redeploy can delete real users and messages.");process.exit(3)}console.log("Production database is Turso; deploying web changes is safe for persistent user data.");'
