name: SFF CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: node --check backend/server.mjs
      - run: node --check backend/db.mjs
      - run: node tests/database-guard.mjs
      - run: node --check backend/account-reset-once.mjs
      - run: node tests/clean-slate.mjs
      - run: node --check backend/extras.mjs
      - run: node --check backend/roles.mjs
      - run: node --check client/app.js
      - run: node --check client/enhance.js
      - run: node --check client/notify-init.js
      - run: node --check client/sff-next.js
      - run: node --check client/social-notifications.js
      - run: node --check client/social-wall.js
      - run: node --check backend/wall.mjs
      - run: node tests/wall.mjs
      - run: node tests/read-state.mjs
      - run: node tests/notification-badges.mjs
      - run: node tests/ambient-theme.mjs
      - run: node tests/mail-failure.mjs
      - run: npm test
