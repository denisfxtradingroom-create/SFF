name: Build SFF installers
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'windows/**'
      - 'android/**'
      - 'client/**'
      - 'backend/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build.yml'

env:
  SFF_PUBLIC_URL: https://sff-signal-api.onrender.com

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Test backend
        shell: pwsh
        run: npm test
      - name: Build Windows installer
        shell: pwsh
        run: .\windows\build.ps1 -Out "$PWD\SFF-Setup.exe" -PortableOut "$PWD\SFF-Windows-Portable.zip" -ServerUrl $env:SFF_PUBLIC_URL
      - uses: actions/upload-artifact@v4
        with:
          name: SFF-Windows
          path: SFF-Setup.exe
          retention-days: 30
      - name: Publish portable Windows app (no installer, no self-extract)
        uses: actions/upload-artifact@v4
        with:
          name: SFF-Windows-Portable
          path: SFF-Windows-Portable.zip
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify public Firebase Android config
        run: |
          python3 - <<'PY'
          import json
          f=json.load(open("android/push/app/google-services.json"))
          assert f["project_info"]["project_id"] == "sff-36587"
          assert any(x.get("client_info",{}).get("android_client_info",{}).get("package_name")=="app.sff.signal" for x in f["client"])
          print("Firebase Android project and package verified")
          PY
      - name: Build Firebase Android APK with real native DM push and replies
        run: gradle --no-daemon -p android/push :app:assembleDebug
      - name: Prepare SFF Android installer
        run: cp android/push/app/build/outputs/apk/debug/app-debug.apk SFF-Android-FCM-0.9.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SFF-Android-FCM
          path: SFF-Android-FCM-0.9.1.apk
          retention-days: 30
