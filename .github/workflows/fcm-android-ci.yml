name: SFF FCM Android compile check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'backend/call-push.mjs'
      - 'backend/dm-calls.mjs'
      - '.github/workflows/fcm-android-ci.yml'
jobs:
  android-fcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Provide non-production Firebase config for compile test only
        run: |
          cat > android/push/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "sff-compile-only",
              "storage_bucket": "sff-compile-only.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                "android_client_info": {"package_name": "app.sff.signal"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyEXAMPLE000000000000000000000000000"}],
              "services": {}
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Compile FCM Android APK (test only; never publish)
        run: gradle --no-daemon -p android/push :app:assembleDebug
