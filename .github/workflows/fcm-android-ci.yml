name: SFF FCM Android compile check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'backend/call-push.mjs'
      - 'backend/dm-calls.mjs'
      - '.github/workflows/fcm-android-ci.yml'
jobs:
  android-fcm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Android Firebase project
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("android/push/app/google-services.json"))
          assert d["project_info"]["project_id"] == "sff-36587"
          print("SFF Firebase configuration OK")
          PY
      - name: Compile SFF Firebase Android APK
        run: gradle --no-daemon -p android/push :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SFF-Android-Firebase-test
          path: android/push/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
